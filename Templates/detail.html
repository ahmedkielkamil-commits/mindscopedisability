<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarePath — Disability Detail</title>
  <style>
    :root {
      --bg: #F8F5EF; --surface: #FFFFFF; --border: #E5E7EB;
      --primary: #0B2D5C; --accent: #F3D26A; --accent-pale: #FEF9EC;
      --text: #0F172A; --muted: #64748B; --light-blue: #89B4D8;
      --sidebar-w: 200px; --radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           font-size: 16px; line-height: 1.6; color: var(--text); background: var(--bg); }
    a { text-decoration: none; }

    .app-shell { display: flex; min-height: 100vh; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--primary);
      display: flex; flex-direction: column;
      z-index: 200; overflow-y: auto;
    }
    .sidebar-logo {
      padding: 28px 20px 22px; display: flex; align-items: center; gap: 11px;
      border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0;
    }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--accent); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.88rem; font-weight: 800; flex-shrink: 0;
    }
    .sidebar-logo span { color: #fff; font-weight: 700; font-size: 1rem; }
    .sidebar-nav { padding: 10px 0; flex: 1; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 20px; font-size: 0.875rem; font-weight: 500;
      color: rgba(255,255,255,0.58); border-left: 3px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .sidebar-nav a:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.88); }
    .sidebar-nav a.active { background: rgba(243,210,106,0.12); color: #fff; border-left-color: var(--accent); font-weight: 600; }
    .nav-icon { font-size: 1rem; opacity: 0.7; flex-shrink: 0; }
    .sidebar-nav a.active .nav-icon { opacity: 1; }

    .main-content { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; }
    .page-container { max-width: 820px; margin: 0 auto; padding: 52px 40px 80px; }

    /* ── Back link ───────────────────────────────────────────────── */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.875rem; color: var(--muted); margin-bottom: 36px;
      padding: 7px 16px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface);
      transition: border-color 0.15s, color 0.15s;
    }
    .back-link:hover { border-color: var(--light-blue); color: var(--primary); }

    /* ── Detail header ───────────────────────────────────────────── */
    .detail-header { margin-bottom: 40px; }
    .detail-header h1 {
      font-size: 2.1rem; font-weight: 800; color: var(--primary);
      margin-bottom: 8px; letter-spacing: -0.02em;
    }
    .detail-header .tagline { font-size: 1rem; color: var(--muted); }
    .accent-rule { width: 52px; height: 4px; background: var(--accent); border-radius: 2px; margin-top: 20px; }

    /* ── Accordion ───────────────────────────────────────────────── */
    .accordion-section { border-bottom: 1px solid var(--border); }
    .accordion-toggle {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; background: none; border: none; cursor: pointer;
      font-size: 0.975rem; font-weight: 600; color: var(--text); text-align: left;
      transition: color 0.15s;
    }
    .accordion-toggle:hover { color: var(--primary); }
    .accordion-toggle[aria-expanded="true"] { color: var(--primary); }
    .accordion-icon {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; margin-left: 16px;
      background: var(--accent-pale); color: var(--light-blue);
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    .accordion-body { padding-bottom: 22px; }
    .accordion-body p { font-size: 0.94rem; line-height: 1.8; color: #334155; max-width: 660px; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; height: 56px; flex-direction: row; align-items: center; position: fixed; top: 0; overflow-x: auto; overflow-y: hidden; }
      .sidebar-logo { padding: 0 16px; border-bottom: none; border-right: 1px solid rgba(255,255,255,0.15); }
      .sidebar-nav { display: flex; flex-direction: row; padding: 0; overflow-x: auto; }
      .sidebar-nav a { padding: 0 14px; height: 56px; border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
      .sidebar-nav a.active { border-bottom-color: var(--accent); border-left-color: transparent; }
      .main-content { margin-left: 0; margin-top: 56px; }
      .page-container { padding: 32px 20px 60px; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">C</div>
      <span>CarePath</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="active">
        <span class="nav-icon">⊙</span> Disabilities
      </a>
      <a href="/carenetwork">
        <span class="nav-icon">◎</span> Learning Support
      </a>
      <a href="/docbreakdown">
        <span class="nav-icon">▣</span> Medical Breakdown
      </a>
      <a href="/iep">
        <span class="nav-icon">◈</span> IEP Analysis
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="page-container">
      <a class="back-link" href="/">← All Disabilities</a>
      <div id="detail"></div>
    </div>
  </main>

</div>

<script src="/disabilities/data.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var disability = DISABILITIES[id];

  if (!disability) {
    window.location.href = '/disabilities';
  } else {
    document.title = 'CarePath — ' + disability.name;
    var container = document.getElementById('detail');

    var header = document.createElement('div');
    header.className = 'detail-header';
    header.innerHTML =
      '<h1>' + disability.name + '</h1>' +
      '<p class="tagline">' + disability.tagline + '</p>' +
      '<div class="accent-rule"></div>';
    container.appendChild(header);

    var sectionOrder = ['reframe', 'brain', 'daytoday', 'whathelps', 'perspective'];
    sectionOrder.forEach(function(key, index) {
      var section = disability.sections[key];
      if (!section) return;
      var isFirst = index === 0;
      var el = document.createElement('div');
      el.className = 'accordion-section';
      el.innerHTML =
        '<button class="accordion-toggle" aria-expanded="' + isFirst + '">' +
          '<span>' + section.title + '</span>' +
          '<span class="accordion-icon">' + (isFirst ? '−' : '+') + '</span>' +
        '</button>' +
        '<div class="accordion-body" style="display:' + (isFirst ? 'block' : 'none') + '">' +
          '<p>' + section.content + '</p>' +
        '</div>';
      el.querySelector('.accordion-toggle').addEventListener('click', function() {
        var body = el.querySelector('.accordion-body');
        var icon = el.querySelector('.accordion-icon');
        var isOpen = body.style.display === 'block';
        body.style.display = isOpen ? 'none' : 'block';
        icon.textContent = isOpen ? '+' : '−';
        this.setAttribute('aria-expanded', String(!isOpen));
      });
      container.appendChild(el);
    });
  }
</script>
</body>
</html>
